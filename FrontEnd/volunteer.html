<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Portal | SHERO-NourishNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="volunteer.html" class="brand">🌱 SHERO-<span>NourishNet</span></a>
        <div class="nav-user">
            <span id="userName" style="font-weight: 600;">Volunteer</span>
            <span class="role-badge" style="background: rgba(245, 158, 11, 0.2); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3);">VOLUNTEER</span>
            <button class="btn-logout" onclick="logout()">Sign Out</button>
        </div>
    </nav>

    <div class="container">
        <div id="volunteerAlert" class="alert" style="display: none;"></div>

        <!-- Deliveries Table -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">🛵 Active Delivery Assignments & GPS Tracker</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Delivery ID</th>
                            <th>Food Item</th>
                            <th>Donor Pickup</th>
                            <th>NGO Destination</th>
                            <th>Current Status</th>
                            <th>Action & GPS</th>
                        </tr>
                    </thead>
                    <tbody id="volunteerDeliveriesTable">
                        <tr><td colspan="6" style="text-align: center;">Loading deliveries...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/volunteer.js"></script>
</body>
</html>
