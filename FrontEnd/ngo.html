<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Portal | SHERO-NourishNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="ngo.html" class="brand">🌱 SHERO-<span>NourishNet</span></a>
        <div class="nav-user">
            <span id="userName" style="font-weight: 600;">NGO Partner</span>
            <span class="role-badge" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3);">NGO</span>
            <button class="btn-logout" onclick="logout()">Sign Out</button>
        </div>
    </nav>

    <div class="container">
        <div id="ngoAlert" class="alert" style="display: none;"></div>

        <!-- Available Surplus Food Feed -->
        <div style="margin-bottom: 2rem;">
            <div class="card-header" style="margin-bottom: 1.5rem;">
                <h2 class="card-title">🍲 Available Surplus Food Feed</h2>
                <span style="font-size: 0.85rem; color: var(--text-muted);">Real-time listings from nearby donors</span>
            </div>
            <div id="foodGrid" class="grid">
                <div class="card" style="grid-column: 1/-1; text-align: center;">Loading available surplus food...</div>
            </div>
        </div>

        <!-- My Food Requests -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📋 My Placed Food Requests</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Req ID</th>
                            <th>Food Item</th>
                            <th>Donor Contact</th>
                            <th>Requested Qty</th>
                            <th>Status</th>
                            <th>Requested At</th>
                        </tr>
                    </thead>
                    <tbody id="ngoRequestsTable">
                        <tr><td colspan="6" style="text-align: center;">Loading requests...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/ngo.js"></script>
</body>
</html>
